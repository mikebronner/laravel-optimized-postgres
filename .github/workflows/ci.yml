name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['^10.0', '^11.0', '^12.0', '^13.0']
        exclude:
          - php: '8.2'
            laravel: '^12.0'
          - php: '8.2'
            laravel: '^13.0'

    name: PHP ${{ matrix.php }} – Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql
          coverage: none

      - name: Set minimum stability for Laravel 13
        if: matrix.laravel == '^13.0'
        run: composer config minimum-stability dev

      - name: Install dependencies
        run: |
          composer require "illuminate/database:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: |
          if [ -f vendor/bin/pest ]; then
            vendor/bin/pest
          elif [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "No test runner found — verifying package loads successfully"
            php -r "require 'vendor/autoload.php'; echo 'Package autoload OK' . PHP_EOL; \$ref = new ReflectionClass(GeneaLabs\LaravelOptimizedPostgres\SchemaGrammar::class); echo 'SchemaGrammar class OK' . PHP_EOL;"
          fi
